# Optional diagnostics override. Apply it together with docker-compose.yml when
# Gorse ports need to be reachable from the host; the production stack keeps
# these ports internal by default.
services:
  gorse:
    ports:
      - "${GORSE_MASTER_GRPC_PORT:-8086}:8086"
      - "${GORSE_DASHBOARD_PORT:-8088}:8088"
