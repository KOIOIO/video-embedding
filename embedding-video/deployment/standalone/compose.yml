name: video-video-standalone

x-app-environment: &app-environment
  TZ: Asia/Shanghai
  CONFIG_FILE: /app/configs/video_prod.yml
  VIDEO_CONFIG_FILE: /app/configs/video_prod.yml
  POSTGRES_DSN: ${POSTGRES_DSN}
  REDIS_ADDR: ${REDIS_ADDR:-10.200.10.12:16379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  COS_SECRET_ID: ${COS_SECRET_ID}
  COS_SECRET_KEY: ${COS_SECRET_KEY}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  ASR_API_KEY: ${ASR_API_KEY:-}

services:
  api:
    image: ${VIDEO_APP_API_IMAGE:-video-service-api:latest}
    entrypoint: []
    environment:
      <<: *app-environment
      HTTP_ADDR: :8081
      JWT_SECRET: ${JWT_SECRET}
      RECBOLE_TRAINER_ENABLED: "false"
    command: ["httpapi"]
    ports:
      - "${VIDEO_APP_HTTP_PORT:-8083}:8081"
    volumes:
      - ../config/video_prod.yml:/app/configs/video_prod.yml:ro
      - video_app_api_logs:/app/logs
      - video_app_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    image: ${VIDEO_APP_API_IMAGE:-video-service-api:latest}
    entrypoint: []
    environment:
      <<: *app-environment
      RECBOLE_TRAINER_ENABLED: "false"
    command: ["worker"]
    volumes:
      - ../config/video_prod.yml:/app/configs/video_prod.yml:ro
      - video_app_worker_logs:/app/logs
      - video_app_storage:/app/storage
    restart: unless-stopped

  recbole_trainer:
    image: ${VIDEO_APP_RECBOLE_IMAGE:-video-recbole-trainer:latest}
    environment:
      <<: *app-environment
      CONFIG_FILE: /app/video-service/configs/video_prod.yml
      VIDEO_CONFIG_FILE: /app/video-service/configs/video_prod.yml
      RECBOLE_TRAINER_ENABLED: "true"
    command: ["recboletrainer"]
    volumes:
      - ../config/video_prod.yml:/app/video-service/configs/video_prod.yml:ro
      - video_app_recbole_data:/app/recbole-training/data
      - video_app_recbole_artifacts:/app/recbole-training/artifacts
      - video_app_recbole_logs:/app/video-service/logs
    restart: unless-stopped

  frontend:
    image: ${VIDEO_APP_FRONTEND_IMAGE:-video-frontend:latest}
    environment:
      API_UPSTREAM: http://api:8081
    ports:
      - "${VIDEO_APP_WEB_PORT:-1325}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  video_app_api_logs:
  video_app_worker_logs:
  video_app_storage:
  video_app_recbole_data:
  video_app_recbole_artifacts:
  video_app_recbole_logs:
