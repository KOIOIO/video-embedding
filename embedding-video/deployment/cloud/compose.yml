name: video-video-cloud

services:
  api:
    image: ${VIDEO_APP_API_IMAGE:-video-service-api:latest}
    entrypoint: []
    environment:
      TZ: Asia/Shanghai
      CONFIG_FILE: /app/configs/video_prod.yml
      VIDEO_CONFIG_FILE: /app/configs/video_prod.yml
      HTTP_ADDR: :8081
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      RECBOLE_TRAINER_ENABLED: "false"
    command: ["httpapi"]
    ports:
      - "${CLOUD_BIND_ADDRESS:-0.0.0.0}:${VIDEO_APP_HTTP_PORT:-8083}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config/video_prod.yml:/app/configs/video_prod.yml:ro
      - video_app_api_logs:/app/logs
      - video_app_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  video_app_api_logs:
  video_app_storage:
